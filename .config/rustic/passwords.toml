# Append-only Backblaze repository for the password store only.
#
# The B2 bucket "madagascar-passwords" has Object Lock enabled with a 30 day
# default retention in compliance mode, and the rclone remote uses a
# bucket-scoped application key without deleteFiles. Nothing in this repository
# can be pruned, so there is intentionally no [forget] section and no prune
# service.
[repository]
repository = "rclone:backblaze-passwords:madagascar-passwords"
password-command = "/home/julian/.local/bin/systemd-pass-fallback rustic-password security/rustic-password"

[[backup.snapshots]]
name = "password-store"
sources = ["/home/julian/.password-store"]
